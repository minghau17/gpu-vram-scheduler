<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>GPU 调度管理器</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 极光壁纸：玻璃面板靠它折射 -->
  <div class="wall" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <span class="blob b5"></span>
    <div class="wall-veil"></div>
    <div class="wall-grain"></div>
  </div>

  <div class="app" id="app">
    <aside class="rail glass" data-lens="1">
      <div class="brand">
        <span class="brand-mark"><img src="../assets/icons/logo.svg" alt="" draggable="false" /></span>
        <span class="brand-text">
          <b>GPU 调度</b>
          <i>Memory&nbsp;Scheduler</i>
        </span>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="rail-foot" id="railFoot"></div>
    </aside>

    <main class="stage">
      <header class="topbar" id="topbar">
        <div class="topbar-titles">
          <h1 id="pageTitle">概览</h1>
          <p id="pageSub">实时显存 · 智能分流</p>
        </div>
        <div class="topbar-actions" id="topActions"></div>
        <div class="win-btns">
          <button class="win-btn" id="winMin" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 10 10"><path d="M2 5h6" /></svg>
          </button>
          <button class="win-btn" id="winMax" title="最大化" aria-label="最大化">
            <svg viewBox="0 0 10 10"><rect x="2.2" y="2.2" width="5.6" height="5.6" rx="1.2" /></svg>
          </button>
          <button class="win-btn win-close" id="winClose" title="关闭" aria-label="关闭">
            <svg viewBox="0 0 10 10"><path d="M2.4 2.4l5.2 5.2M7.6 2.4L2.4 7.6" /></svg>
          </button>
        </div>
      </header>

      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <div class="sheet-layer" id="sheetLayer" hidden></div>

  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <filter id="lg-lens" x="-25%" y="-25%" width="150%" height="150%"
            color-interpolation-filters="sRGB" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="9" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="7" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="34"
                         xChannelSelector="R" yChannelSelector="G" result="warp" />
      <feGaussianBlur in="warp" stdDeviation="0.4" />
    </filter>
  </svg>

  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
